name: Agent

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: agent-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/ryouol/senpilot-docket
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test and lint
        run: |
          python -m pip install uv==0.12.8
          uv sync --frozen --extra dev
          uv run pytest -q
          uv run ruff check src tests
          uv run ruff format --check src tests
          shellcheck deploy/update-agent.sh
      - name: Build and smoke-test the image
        run: |
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "io.docket.run=$GITHUB_RUN_NUMBER" \
            --tag "$IMAGE:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" .
          docker run --rm --network none --user 1001:1001 \
            "$IMAGE:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            python -c 'import docket.agent; from docket.main import main; main()' --help
      - name: Publish and promote the current main revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          tag="$IMAGE:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker push "$tag"
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" != "$GITHUB_SHA" ]]; then
            echo 'A newer main revision exists; leaving current unchanged.'
            exit 0
          fi
          docker tag "$tag" "$IMAGE:current"
          docker push "$IMAGE:current"
