[project]
name = "senpilot-docket"
version = "0.1.0"
description = "A tool-using email agent for regulatory filings"
requires-python = ">=3.12"
dependencies = [
  "openai-agents>=0.24,<0.25",
  "playwright==1.64.1",
  "pydantic>=2.12,<3",
  "httpx>=0.28,<1",
  "imapclient>=3,<5",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14"]

[project.scripts]
docket = "docket.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docket"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
